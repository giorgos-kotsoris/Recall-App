{% extends 'base.html' %}{% block content %}
<div class="heading">
    <h1>Ο λογαριασμός μου</h1>
    <a href="{{ url_for('members.index') }}">← Πίσω</a>
</div>
<section class="card form-card">
    <form method="post">
        <label>Username
            <input name="username" value="{{ current_user.username }}" minlength="3" required></label>
        <label>Νέος κωδικός (προαιρετικά)
            <input type="password" name="password" minlength="8"></label>
        <label>Επιβεβαίωση νέου κωδικού
            <input type="password" name="password_confirmation" minlength="8"></label>
        <button class="primary">Αποθήκευση αλλαγών</button>
    </form>
</section>
{% endblock %}
